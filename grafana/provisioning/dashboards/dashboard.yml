# =============================================================================
#  Grafana dashboard provider — a JSON dashboardokat tölti be lemezről
# =============================================================================
apiVersion: 1

providers:
  - name: NordMart
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
